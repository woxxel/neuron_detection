[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-detection"              # distribution name (pip install neuron-detection)
version = "0.1.0"
description = "Wrapper package for robust neuron detection using CaImAn"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}       # change if you have a LICENSE file
authors = [{name = "Your Name"}]

# Put your pip-installable deps here, e.g.
dependencies = [
  # "numpy>=1.24",
  # "scipy>=1.10",
  # "opencv-python>=4.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuron_detection*"]

[project.scripts]
neuron-detection = "neuron_detection.run_detection:main"