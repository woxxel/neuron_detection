[build-system]
requires = [
    "setuptools>=77.0.3",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "CIDBN-neuron-detection"              # distribution name (pip install neuron-detection)
dynamic = ["version"]
description = "Wrapper package for robust neuron detection using CaImAn"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alexander Schmidt"}]

# Put your pip-installable deps here, e.g.
dependencies = [
  "numpy",
  "scipy",
  "opencv-python",
  "tifffile",
  "tqdm",
  "h5py",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuron_detection*"]

[project.scripts]
neuron-detection = "neuron_detection.run_detection:main"

[tool.setuptools_scm]
version_file = "neuron_detection/_version.py"
local_scheme = "no-local-version"